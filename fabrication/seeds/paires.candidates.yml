# Lot de paires — 24, figées pour paires.json (arbitrage 2026-08-18).
# majorite = personnage le plus connu (celui de la majorité des joueurs).
# Difficulté : ce que le grand public connaît du duo, pas l'encodage du
# nouveau graphe. Un second emblématique (Kid/Killer) reste facile même si
# le lien passe par un nœud partagé — le type n'est qu'un défaut.
# arc_etablissement = anti-spoil : une paire n'est proposée qu'aux tables
# calibrées au-delà de cet arc.
# Types de lien : fraternite = fratrie (sang ou serment), parente =
# parent-enfant, famille = au-delà (grand-parent, oncle, ...).

