# Revue LLM — générée par fabrication/llm_review.py (glm-5.2).
# Artefact régénérable ; l'état arbitré vit dans les seeds.
# Doctrine (docs/pipeline.md) : le LLM n'est jamais décideur —
# il drapeaute en amont des requêtes, l'humain arbitre et édite
# les seeds. Jamais entre le graphe et l'export.
# Contrôles : D difficulté · S sens majorite/imposteur · A arc
#             d'établissement · L type/libellé.

drapeaux:
  - paire: "usopp-yasopp"
    controle: "D"
    statut: "à arbitrer"
    proposition: "facile -> intermediaire"
    justification: "Yasopp n'est qu'un officier secondaire des Red Hair Pirates (infobox : Senior Officer, aperçu au chapitre 1) et le lien père-fils n'est exposé qu'à Syrup Village ; duo nettement moins emblématique pour le grand public que Zeff, Kuina ou Bell-mère, eux aussi classés faciles."
  - paire: "buggy-shanks"
    controle: "D"
    statut: "à arbitrer"
    proposition: "facile -> intermediaire"
    justification: "Chacun est célèbre individuellement, mais leur lien commun (mousses sur l'Oro Jackson, 'Roger Pirates (former)' pour les deux selon les infobox) n'est révélé que par un bref flashback à Loguetown : c'est un semi-blind test pour le grand public, pas une évidence type Luffy-Shanks."
  - paire: "zoro-sanji"
    controle: "A"
    statut: "à arbitrer"
    proposition: "arlong_park -> baratie"
    justification: "Sanji rejoint l'équipage et le duo interagit avec Zoro dès l'arc Baratie (débuts chapitre 3 / 43 selon les infobox) ; calibrer sur arlong_park sous-utilise la paire d'un arc entier."
  - paire: "buggy-shanks"
    controle: "L"
    statut: "à arbitrer"
    proposition: "fraternite -> equipage"
    justification: "Aucun lien familial ou fraternel : les deux infobox listent 'Roger Pirates (former)', ils étaient mousses sur le même navire — ce que le libellé dit lui-même ; 'equipage' (voire 'rivalite') colle au lien réel."
  - paire: "luffy-ace"
    controle: "A"
    statut: "à arbitrer"
    proposition: "arabasta -> post_enies_lobby (ou libellé neutre type « Le grand frère de Luffy »)"
    justification: "La fraternité Luffy-Ace est bien connue dès Arabasta, mais le libellé « par serment » renvoie à la cérémonie du sakazuki révélée uniquement dans le flashback post-Enies Lobby ; une table calibrée juste après Arabasta ne connaît pas ce motif."
  - paire: "vivi-crocodile"
    controle: "S"
    statut: "à arbitrer"
    proposition: "inverser : crocodile en majorite, nefertari_vivi en imposteur"
    justification: "Crocodile est un antagoniste emblématique récurrent (ex-Capitaine corsaire, Cross Guild, prime 1 965 000 000, adaptation live-action annoncée selon l'infobox) tandis que Vivi disparaît de l'histoire après Arabasta : notoriété grand public probablement supérieure côté Crocodile."
  - paire: "teach-thatch"
    controle: "D"
    statut: "à arbitrer"
    proposition: "facile -> difficile"
    justification: "Thatch n'apparaît qu'en flashback (debut chapitre 440, épisode 325) comme simple 4e commandant/cuisinier ; le grand public connaît Blackbeard mais pas sa victime, contrairement à des duos comme Lucci-Kaku calibrés intermediaire."
  - paire: "teach-thatch"
    controle: "A"
    statut: "à arbitrer"
    proposition: "jaya -> post_enies_lobby"
    justification: "L'identité de Thatch et le meurtre par Teach pour le fruit ne sont révélés qu'au chapitre 440 / épisode 325 (Post-Enies Lobby) ; à Jaya, Teach apparaît sans aucun lien établi avec Thatch — proposer la paire dès une table water_7/enies_lobby spoile."
  - paire: "enel-wyper"
    controle: "D"
    statut: "à arbitrer"
    proposition: "facile -> intermediaire"
    justification: "Wyper reste un secondaire (« former leader of the Shandia warriors ») d'un arc souvent périphérique pour le grand public ; Enel porte seul la notoriété du duo."
  - paire: "lucci-kaku"
    controle: "L"
    statut: "à arbitrer"
    proposition: "equipage -> faction"
    justification: "CP9 est une agence secrète du Gouvernement mondial (wiki : « Cipher Pol Agent », affiliations CP9/CP0), pas un équipage pirate ; « faction » rend mieux la nature du lien."
  - paire: "lucci-kaku"
    controle: "D"
    statut: "à arbitrer"
    proposition: "intermediaire -> facile"
    justification: "Enies Lobby est l'arc le plus exposé de la série ; Lucci (Doriki 4000, « Massacre Weapon ») et Kaku (second combat majeur, fruit de la girafe ultra-mémorable) forment un duo iconique — la règle « second emblématique = facile » s'applique."
  - paire: "hancock-sandersonia"
    controle: "D"
    statut: "à arbitrer"
    proposition: "facile -> intermediaire"
    justification: "Hancock est très connue, mais Sandersonia reste secondaire (régente d'Amazon Lily, prime de 40M selon l'infobox) ; hors public ayant vu l'arc Amazon Lily, le grand public connaît surtout Hancock seule. Moins notoire que les paires réellement faciles du lot (Roger/Garp, Ace/Teach)."
  - paire: "rayleigh-shakuyaku"
    controle: "D"
    statut: "à arbitrer"
    proposition: "facile -> intermediaire"
    justification: "Shakky est un personnage mineur (barwoman, ex-Kuja) et le statut de couple est révélé discrètement — le wiki le confirme seulement dans l'intro (« She lives with her husband Silvers Rayleigh »). Duo peu connu du grand public comparé à Rayleigh seul."
  - paire: "doflamingo-rosinante"
    controle: "L"
    statut: "à arbitrer"
    proposition: "parente -> fraternite"
    justification: "Rosinante est le frère biologique de Doflamingo (famille Donquixote) ; le type fraternite existe dans la taxonomie et est déjà utilisé pour ace-sabo. Parente est imprécis pour un lien fraternel direct."
  - paire: "kuma-dragon"
    controle: "D"
    statut: "à arbitrer"
    proposition: "facile -> intermediaire"
    justification: "Les deux sont célèbres individuellement, mais le lien du duo (Kuma commandant sous Dragon dans l'Armée révolutionnaire, cf. affiliations « Freedom Fighters (former) » / « Revolutionary Army ») n'est connu que via flashbacks (Marineford, flashback de Sabo, biographie Egghead) : c'est de la connaissance d'initié, pas du grand public."
  - paire: "kuma-dragon"
    controle: "S"
    statut: "à arbitrer"
    proposition: "majorite: monkey_d_dragon, imposteur: bartholomew_kuma"
    justification: "Dragon, « World's Worst Criminal » et père de Luffy révélé dès le chapitre 100/épisode 52, est plus emblématique du grand public que Kuma ; inversion probable du couple majorite/imposteur."
  - paire: "kuma-dragon"
    controle: "A"
    statut: "à arbitrer"
    proposition: "egghead -> dressrosa"
    justification: "L'appartenance de Kuma à l'Armée révolutionnaire de Dragon est établie bien avant Egghead (révélations Marineford, puis flashback de Sabo durant Dressrosa) ; Egghead n'ajoute que le passé personnel. Calibrer sur Egghead sous-utilise la paire (tables très avancées uniquement)."
  - paire: "shirahoshi-otohime"
    controle: "L"
    statut: "à arbitrer"
    proposition: "libelle: « Mère et fille, reine et princesse sirène » (retirer « la voix des Poséidons »)"
    justification: "Seule Shirahoshi porte l'alias « Poseidon » (infobox : Alias \"Poseidon\") ; Otohime n'est jamais désignée ainsi, le pluriel « Poséidons » est inexact dans un libellé affiché aux joueurs."
  - paire: "kaidou-yamato"
    controle: "L"
    statut: "à arbitrer"
    proposition: "libelle: « Père ogre, enfant rebelle » (ou « fils rebelle ») au lieu de « fille rebelle »"
    justification: "L'extrait wiki ouvre par « Yamato is the son of Kaidou », explicitement « Born as Kaidou's daughter » puis identification masculine ; « fille rebelle » contredit la référence du wiki."
  - paire: "bonney-kuma"
    controle: "S"
    statut: "à arbitrer"
    proposition: "majorite: bartholomew_kuma, imposteur: jewelry_bonney"
    justification: "Kuma (ex-Grand Corsaire, antagoniste mémorable de Sabaody/Marineford, matrice des Pacifista) est plus connu du grand public que Bonney, supernova secondaire jusqu'à Egghead ; inversion probable."
notes:
  - "Lot homogène 100 % East Blue : couverture cohérente des arcs fondateurs ; à équilibrer plus tard avec des paires post-ellipse pour les tables avancées."
  - "Normalisation des slugs avant export figé : 'bell_mère' porte un accent contrairement aux autres identifiants (et à l'id de paire 'nami-bell-mere')."
  - "zoro-sanji : notoriété quasi équivalente (2e/3e habituels des sondages de popularité) ; zoro en majorite reste défendable, à surveiller en playtest."
  - "zoro-mihawk : type 'rivalite' correct à l'établissement (Baratie), mais anticiper un recouvrement si une future paire mentorat Mihawk-Zoro (ellipse) est ajoutée."
  - "Le calibrage D semble incohérent au sein du lot : des paires avec un membre obscur (teach-thatch, enel-wyper) sont marquées « facile » alors que lucci-kaku, duo d'un arc plus exposé, est en « intermediaire ». Les drapeaux individuels proposent une remise à plat."
  - "Lot centré sur Arabasta-Water 7 ; aucune paire très tardive (Marineford, Wano) : rien à signaler sur la couverture, mais les seeders pourraient équilibrer les lots suivants."
  - "Convention parente/fraternite à arbitrer globalement : ace-sabo (frères par serment) est typé fraternite, doflamingo-rosinante (frères de sang) et hancock-sandersonia (sœurs de sang) sont typés parente — une règle unique (sang vs serment, ou genre de la fratrie) éviterait l'incohérence."
  - "kid-killer maintenu « facile » conformément à la règle du second emblématique (bras droit masqué), Killer étant de surcroît membre de la Worst Generation selon le wiki."
  - "Ace apparaît deux fois en majorite (ace-teach, ace-sabo) sans autre doublon dans le lot ; à vérifier si le jeu tolère qu'un même personnage porte plusieurs paires."
  - "Kuma apparaît dans deux paires de ce lot (kuma-dragon, bonney-kuma) : vérifier la redondance de personnage à l'export et éventuellement n'en retenir qu'une."
  - "Couverture du lot exclusivement post-timeskip (fish_man_island -> egghead), aucune paire East Blue/Alabasta : à surveiller sur l'ensemble des seeds, pas bloquant ici."
  - "Arc « egghead » utilisé pour deux paires ; si l'arbitrage suit la proposition dressrosa pour kuma-dragon, la paire bonney-kuma reste correctement calibrée sur egghead (la révélation père/fille y est le cœur de l'arc)."
